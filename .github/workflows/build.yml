name: Build Kai APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract Kai ZIP
        run: |
          mkdir kai
          unzip -q Kai_v2_Complete_Android_Project.zip -d kai

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Kai APK
        working-directory: kai
        run: gradle assembleDebug --no-daemon

      - name: Upload Kai APK
        uses: actions/upload-artifact@v4
        with:
          name: Kai-v2-APK
          path: kai/app/build/outputs/apk/debug/app-debug.apk
